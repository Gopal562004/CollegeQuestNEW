<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COLLEGE SEARCH RESULTS - COLLEGEQUEST</title>
  <link rel="icon" href="./images/logob.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            accent: '#000000',
            bg: '#ffffff',
            text: '#000000',
            muted: '#6b7280',
            surface: '#f9fafb'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
    }
    
    .border-hard { border: 2px solid #000000; }
    .border-b-hard { border-bottom: 2px solid #000000; }
    .border-t-hard { border-top: 2px solid #000000; }
    .border-r-hard { border-right: 2px solid #000000; }
    .border-l-hard { border-left: 2px solid #000000; }
    
    /* Table styles */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 1rem; border-bottom: 2px solid #000; text-transform: uppercase; font-weight: 900; letter-spacing: 0.05em; font-size: 0.875rem; background: #000; color: #fff;}
    td { padding: 1rem; border-bottom: 1px solid #000; font-weight: 500;}

    /* Loader */
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #000000;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .modal-overlay {
      background-color: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

<div id="collegeDetails" class="flex-grow flex flex-col">
  <div class="flex-grow flex flex-col items-center justify-center bg-surface">
    <div class="spinner mb-6"></div>
    <div class="font-black text-2xl uppercase tracking-widest">Searching Database...</div>
  </div>
</div>

<!-- Full-Screen Search Modal -->
<div id="search-modal" class="fixed inset-0 z-[100] hidden modal-overlay items-center justify-center p-4">
  <div class="w-full max-w-4xl bg-white border-hard shadow-[16px_16px_0px_0px_rgba(0,0,0,1)] flex flex-col">
    <div class="flex justify-between items-center border-b-hard p-4 bg-surface">
      <div class="font-black uppercase tracking-widest">Search Database</div>
      <button onclick="toggleModal('search-modal')" class="hover:bg-black hover:text-white px-2 py-1 font-bold">X</button>
    </div>
    <div class="p-8 md:p-16">
      <input 
        type="text" 
        id="search" 
        class="w-full border-b-hard text-4xl md:text-6xl font-black uppercase focus:outline-none focus:border-b-4 placeholder-gray-300 pb-4" 
        placeholder="ENTER COLLEGE..."
        onkeypress="handleKeyPress(event)"
        oninput="handleSearchInputEvent(event)"
        autocomplete="off"
      >
      <div id="search-suggestions-list" class="mt-4 flex flex-col border-hard bg-white shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] empty:border-none empty:shadow-none transition-all"></div>
    </div>
  </div>
</div>

<script type="module">
  import { db, auth, onAuthStateChanged } from "./auth.js";
  import { collection, query, where, getDocs, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let currentUser = null;
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    const loginBtn = document.getElementById('nav-login-btn');
    if (loginBtn) {
      if (user) {
        loginBtn.innerText = "Profile";
        loginBtn.onclick = () => window.location.href = "profile.html";
      } else {
        loginBtn.innerText = "Login";
        loginBtn.onclick = () => window.location.href = "index.html";
      }
    }
  });

  window.toggleModal = function(id) {
    const modal = document.getElementById(id);
    if (modal.classList.contains('hidden')) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      if(id === 'search-modal') {
        setTimeout(() => document.getElementById('search').focus(), 100);
      }
    } else {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
  }

  window.handleKeyPress = function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      const searchTerm = document.getElementById('search').value.trim();
      if (searchTerm) {
        window.location.href = `testing.html?key=${encodeURIComponent(searchTerm)}`;
      }
    }
  }

  let collegesPromise = null;
  window.handleSearchInputEvent = async function(event) {
    const input = event.target.value.toLowerCase().trim();
    const suggestionsContainer = document.getElementById('search-suggestions-list');

    if (input.length < 2) {
      suggestionsContainer.innerHTML = '';
      return;
    }

    if (!collegesPromise) {
      collegesPromise = (async () => {
        try {
          const { collection, getDocs } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
          const querySnapshot = await getDocs(collection(db, "colleges"));
          let cache = [];
          querySnapshot.forEach((doc) => {
            cache.push({
              id: doc.id,
              name: doc.data().name || doc.id
            });
          });
          return cache;
        } catch (err) {
          console.error("Error fetching suggestions", err);
          return [];
        }
      })();
    }

    const cache = await collegesPromise;
    const filtered = cache.filter(c => c.name.toLowerCase().includes(input)).slice(0, 5);

    if (filtered.length > 0) {
      suggestionsContainer.innerHTML = filtered.map(c => 
        `<div onclick="selectSuggestion('${c.name.replace(/'/g, "\\'")}')" class="p-4 border-b border-gray-200 hover:bg-black hover:text-white cursor-pointer font-bold uppercase transition-colors md:text-xl">
          ${c.name}
         </div>`
      ).join('');
    } else {
      suggestionsContainer.innerHTML = `<div class="p-4 font-bold uppercase text-muted md:text-xl">No colleges found</div>`;
    }
  }

  window.selectSuggestion = function(name) {
    document.getElementById('search').value = name;
    window.location.href = `testing.html?key=${encodeURIComponent(name)}`;
  }

  async function searchColleges() {
    const searchParams = new URLSearchParams(window.location.search);
    const key = searchParams.get("key");

    if (key) {
      const searchInput = key.toLowerCase().trim();
      try {
        const q = query(collection(db, "colleges"), where("searchTerms", "array-contains", searchInput));
        const querySnapshot = await getDocs(q);

        if (!querySnapshot.empty) {
          const searchedCollege = querySnapshot.docs[0].data();
          const collegeId = querySnapshot.docs[0].id;
          renderSearchedCollege(searchedCollege, collegeId);
        } else {
          renderError("NOT FOUND", "College not found in our database.");
        }
      } catch (error) {
        console.error("Error fetching from Firestore:", error);
        renderError("ERROR", "Failed to connect to the database.");
      }
    } else {
      renderError("ERROR", "No search query provided.");
    }
  }

  function renderError(title, message) {
    document.getElementById("collegeDetails").innerHTML = `
      <div class="flex-grow flex flex-col items-center justify-center bg-surface p-8 text-center">
        <h1 class="text-6xl md:text-8xl font-black uppercase tracking-tighter mb-6">${title}</h1>
        <p class="font-bold text-xl mb-8">${message}</p>
        <button onclick="window.location.href='index.html'" class="border-hard bg-black text-white px-8 py-4 font-bold uppercase tracking-widest hover:bg-white hover:text-black transition-colors shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] hover:shadow-none hover:translate-x-2 hover:translate-y-2">
          RETURN TO SEARCH
        </button>
      </div>
    `;
  }

  function initializeChart(collegeData) {
    setTimeout(() => {
      var canvas = document.getElementById("lineChart");
      if(canvas) {
        var ctx = canvas.getContext("2d");
        new Chart(ctx, {
          type: "line",
          data: {
            labels: ["'18", "'20", "'22", "'24"],
            datasets: [{
              label: "Placement Rate / Avg Package",
              data: [
                parseFloat(collegeData.placement?.y2014 || collegeData.placement?.y2016 || "3.5"),
                parseFloat(collegeData.placement?.y2017 || collegeData.placement?.y2020 || "3.8"),
                parseFloat(collegeData.placement?.y2018 || collegeData.placement?.y2021 || "4.2"),
                parseFloat(collegeData.placement?.y2022 || collegeData.placement?.y2024 || "4.8"),
              ],
              borderColor: "#000000",
              backgroundColor: "rgba(0,0,0,0.1)",
              borderWidth: 4,
              pointBackgroundColor: "#ffffff",
              pointBorderColor: "#000000",
              pointBorderWidth: 3,
              pointRadius: 6,
              pointHoverRadius: 8,
              fill: true,
              tension: 0
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { 
                beginAtZero: true,
                grid: { color: "#e5e7eb" },
                ticks: { font: { family: "Inter", weight: "bold" }, color: "#000" }
              },
              x: {
                grid: { display: false },
                ticks: { font: { family: "Inter", weight: "bold" }, color: "#000" }
              }
            }
          }
        });
      }
    }, 500);
  }

  function renderSearchedCollege(collegeData, collegeId) {
    const collegeDetails = document.getElementById("collegeDetails");

    let coursesHtml = '';
    for(let i=1; i<=6; i++) {
      const course = collegeData.courses?.[`c${i}`];
      if(course) {
        coursesHtml += `
          <div class="border-hard p-6 bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex flex-col hover:-translate-y-1 hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] transition-all">
            <h4 class="font-black text-xl mb-4 border-b-hard pb-4 uppercase">${course.name}</h4>
            <div class="flex justify-between items-center mb-2 font-medium text-sm"><span class="text-muted uppercase tracking-wider">Seats</span> <span class="font-bold">${course.seat}</span></div>
            <div class="flex justify-between items-center mb-2 font-medium text-sm"><span class="text-muted uppercase tracking-wider">Exams</span> <span class="font-bold">${course.exams || 'JEE / MHT CET'}</span></div>
            <div class="flex justify-between items-center mb-6 font-medium text-sm"><span class="text-muted uppercase tracking-wider">Duration</span> <span class="font-bold">${course.duration || '4 Years'}</span></div>
            <div class="mt-auto border-t-hard pt-4 flex justify-between items-end">
              <div class="font-black text-xl">₹ ${course.fees || collegeData.fees || 'N/A'} <span class="text-xs font-bold text-muted">/YR</span></div>
            </div>
          </div>
        `;
      }
    }

    let reviewsHtml = '';
    for(let i=1; i<=4; i++) {
      const review = collegeData.reviews?.[`r${i}`];
      if(review) {
        reviewsHtml += `
          <div class="p-8 border-b-hard ${i%2!==0 ? 'md:border-r-hard bg-white' : 'bg-surface'} flex flex-col">
            <div class="font-black text-4xl mb-4 text-gray-300 leading-none">"</div>
            <p class="font-medium text-base flex-grow mb-8">${review.review || 'No review text provided.'}</p>
            <div class="border-t-hard pt-4 mt-auto">
              <div class="font-bold uppercase tracking-widest text-sm">${review.username || 'Anonymous'}</div>
              <div class="text-xs text-muted uppercase font-bold tracking-wider">Verified Student</div>
            </div>
          </div>
        `;
      }
    }

    collegeDetails.innerHTML = `
      <!-- Navigation -->
      <nav class="w-full border-b-hard bg-bg sticky top-0 z-50">
        <div class="flex justify-between items-stretch h-16">
          <a href="index.html" class="flex items-center px-6 border-r-hard font-black text-2xl tracking-tighter uppercase hover:bg-black hover:text-white transition-colors">
            COLLEGEQUEST
          </a>
          <div class="flex flex-grow justify-end">
            <button onclick="toggleModal('search-modal')" class="flex items-center justify-center px-6 border-l-hard hover:bg-black hover:text-white transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>

            <button id="nav-login-btn" onclick="window.location.href='index.html'" class="hidden md:flex items-center justify-center px-8 border-l-hard bg-black text-white font-bold text-sm uppercase tracking-wide hover:bg-surface hover:text-black transition-colors">
              Login
            </button>
          </div>
        </div>
      </nav>

      <!-- College Header -->
      <header class="border-b-hard flex flex-col md:flex-row bg-surface">
        <div class="w-full md:w-1/3 border-b-hard md:border-b-0 md:border-r-hard p-12 flex items-center justify-center bg-white">
          <div class="w-48 h-48 border-hard shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] p-4 bg-white flex items-center justify-center">
            <img src="${collegeData.images?.logo || './images/st.jpeg'}" alt="College Logo" class="max-w-full max-h-full object-contain">
          </div>
        </div>
        <div class="w-full md:w-2/3 p-12 flex flex-col justify-center">
          <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tighter leading-none mb-6">${collegeData.name || 'College Name'}</h1>
          <div class="flex flex-wrap gap-4 mb-8">
            <div class="border-hard px-4 py-2 font-bold uppercase tracking-widest text-sm bg-black text-white">Private Institution</div>
            <div class="border-hard px-4 py-2 font-bold uppercase tracking-widest text-sm bg-white">Rating: 4.5/5</div>
          </div>
          <div class="flex gap-4">
            <button class="border-hard bg-black text-white px-8 py-3 font-bold uppercase tracking-widest text-sm hover:bg-white hover:text-black transition-colors shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:shadow-none hover:translate-x-1 hover:translate-y-1">
              Download Brochure
            </button>
            <button id="save-wishlist-btn" class="border-hard bg-white text-black px-8 py-3 font-bold uppercase tracking-widest text-sm hover:bg-surface transition-colors shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:shadow-none hover:translate-x-1 hover:translate-y-1">
              Save to Wishlist
            </button>
          </div>
        </div>
      </header>

      <!-- Marquee Divider -->
      <div class="border-b-hard bg-black text-white overflow-hidden whitespace-nowrap py-2 flex items-center">
        <div class="animate-[marquee_15s_linear_infinite] inline-block font-bold uppercase tracking-widest text-xs">
          <span class="mx-4">ENGINEERING</span> • 
          <span class="mx-4">MANAGEMENT</span> • 
          <span class="mx-4">AICTE APPROVED</span> • 
          <span class="mx-4">TOP PLACEMENTS</span> •
          <span class="mx-4">ENGINEERING</span> • 
          <span class="mx-4">MANAGEMENT</span> • 
          <span class="mx-4">AICTE APPROVED</span> • 
          <span class="mx-4">TOP PLACEMENTS</span> •
          <span class="mx-4">ENGINEERING</span> • 
          <span class="mx-4">MANAGEMENT</span> • 
          <span class="mx-4">AICTE APPROVED</span> • 
          <span class="mx-4">TOP PLACEMENTS</span>
        </div>
      </div>

      <!-- Sticky Sub-Nav -->
      <div class="sticky top-16 z-40 bg-white border-b-hard overflow-x-auto whitespace-nowrap scrollbar-hide">
        <div class="flex">
          <a href="#section-about" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">Info</a>
          <a href="#section-courses" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">Courses & Fees</a>
          <a href="#section-admission" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">Admission</a>
          <a href="#section-reviews" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">Reviews</a>
          <a href="#section-cutoff" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">CutOff</a>
          <a href="#section-placement" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">Placement</a>
          <a href="#section-ranking" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">Ranking</a>
          <a href="#section-gallery" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">Gallery</a>
          <a href="#section-scholarship" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">Scholarship</a>
          <a href="#section-faculty" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">Faculty</a>
          <a href="#section-news" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">News</a>
          <a href="#section-hostel" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">Hostel</a>
          <a href="#section-qa" class="px-6 py-4 font-bold uppercase tracking-widest text-sm border-r-hard hover:bg-black hover:text-white transition-colors">Q&A</a>
        </div>
      </div>

      <!-- Main Content Grid -->
      <div class="flex flex-col lg:flex-row flex-grow">
        
        <!-- Left Column -->
        <main class="w-full lg:w-2/3 border-b-hard lg:border-b-0 lg:border-r-hard">
          <!-- About -->
          <section id="section-about" class="border-b-hard p-8 md:p-12">
            <h2 class="text-3xl font-black uppercase tracking-tight mb-6">About</h2>
            <p class="font-medium text-lg leading-relaxed text-muted">
              ${collegeData.description || 'Information not available.'}
            </p>
          </section>

          <!-- Courses & Fees -->
          <section id="section-courses" class="border-b-hard">
            <div class="p-8 border-b-hard bg-surface">
              <h2 class="text-3xl font-black uppercase tracking-tight">Courses & Fees</h2>
            </div>
            <div class="p-8">
              <div class="border-hard mb-12 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
                <table>
                  <thead>
                    <tr>
                      <th>Course</th>
                      <th>1st Year Fees</th>
                      <th>Eligibility</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td class="font-bold">B.E. / B.Tech</td>
                      <td>₹ ${collegeData.fees || 'N/A'}</td>
                      <td>10+2: 45% | JEE Main, MHT CET</td>
                    </tr>
                    <tr>
                      <td class="font-bold">MBA / PGDM</td>
                      <td>₹ 1,40,000</td>
                      <td>Graduation: 50% | MAT, XAT</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <h3 class="text-xl font-black uppercase tracking-widest mb-6">Specializations</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                ${coursesHtml}
              </div>
            </div>
          </section>

          <!-- Admission -->
          <section id="section-admission" class="border-b-hard p-8 md:p-12">
            <h2 class="text-3xl font-black uppercase tracking-tight mb-6">Admission 2026</h2>
            <p class="font-medium text-lg leading-relaxed text-muted">
              ${collegeData.admission || 'Admission details not provided.'}
            </p>
          </section>

          <!-- CutOff -->
          <section id="section-cutoff" class="border-b-hard">
            <div class="p-8 border-b-hard bg-surface">
              <h2 class="text-3xl font-black uppercase tracking-tight">CutOffs</h2>
            </div>
            <div class="p-8">
              <div class="border-hard shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] overflow-x-auto">
                <table class="w-full text-left whitespace-nowrap">
                  <thead>
                    <tr class="border-b-hard bg-surface">
                      <th class="p-4 uppercase tracking-widest text-sm">Course</th>
                      <th class="p-4 uppercase tracking-widest text-sm border-l-hard">Category</th>
                      <th class="p-4 uppercase tracking-widest text-sm border-l-hard">Percentile</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${(collegeData.cutoffs || []).map(c => `
                    <tr class="border-b-hard last:border-b-0 hover:bg-black hover:text-white transition-colors">
                      <td class="p-4 font-bold border-r-hard">${c.course}</td>
                      <td class="p-4 font-medium border-r-hard">${c.category}</td>
                      <td class="p-4 font-bold">${c.percentile}</td>
                    </tr>`).join('')}
                    ${!collegeData.cutoffs ? `<tr><td colspan="3" class="p-8 text-center text-muted font-bold uppercase">Cutoff data not available</td></tr>` : ''}
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <!-- Ranking -->
          <section id="section-ranking" class="border-b-hard p-8 md:p-12">
            <h2 class="text-3xl font-black uppercase tracking-tight mb-6">Ranking & Awards</h2>
            <p class="font-medium text-lg leading-relaxed text-muted">
              ${collegeData.ranking || 'Ranking details not available.'}
            </p>
          </section>

          <!-- Reviews -->
          <section id="section-reviews" class="border-b-hard">
            <div class="p-8 border-b-hard flex justify-between items-center bg-black text-white">
              <h2 class="text-2xl font-black uppercase tracking-tight">Student Reviews</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2">
              ${reviewsHtml || '<div class="p-8 font-bold">No reviews yet.</div>'}
            </div>
          </section>

          <!-- Facilities -->
          <section class="border-b-hard">
            <div class="p-8 border-b-hard bg-surface">
              <h2 class="text-3xl font-black uppercase tracking-tight">Campus Facilities</h2>
            </div>
            <div class="p-8 flex flex-wrap gap-4">
              ${(collegeData.facilities || ['Library', 'Cafeteria', 'Hostel', 'Sports Complex', 'Gym', 'Wi-Fi Campus', 'Auditorium', 'Labs']).map(fac => 
                `<div class="border-hard px-6 py-3 font-bold uppercase tracking-widest text-sm bg-white hover:bg-black hover:text-white transition-colors cursor-default shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:shadow-none hover:translate-x-1 hover:translate-y-1">
                  ${fac}
                 </div>`
              ).join('')}
            </div>
          </section>

          <!-- Gallery -->
          <section id="section-gallery" class="border-b-hard">
            <div class="p-8 border-b-hard bg-surface">
              <h2 class="text-3xl font-black uppercase tracking-tight">Gallery</h2>
            </div>
            <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
              ${(collegeData.gallery || []).map(url => `
                <div class="border-hard shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] h-48 bg-cover bg-center hover:scale-[1.02] transition-transform" style="background-image: url('${url}')"></div>
              `).join('')}
              ${!collegeData.gallery ? `<div class="text-muted font-bold uppercase col-span-2">No images available</div>` : ''}
            </div>
          </section>

          <!-- Scholarship -->
          <section id="section-scholarship" class="border-b-hard p-8 md:p-12">
            <h2 class="text-3xl font-black uppercase tracking-tight mb-6">Scholarships</h2>
            <p class="font-medium text-lg leading-relaxed text-muted">
              ${collegeData.scholarship || 'Scholarship details not available.'}
            </p>
          </section>

          <!-- Faculty -->
          <section id="section-faculty" class="border-b-hard">
            <div class="p-8 border-b-hard bg-surface">
              <h2 class="text-3xl font-black uppercase tracking-tight">Faculty</h2>
            </div>
            <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
              ${(collegeData.faculty || []).map(f => `
                <div class="border-hard p-6 bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                  <h4 class="font-black text-xl mb-2">${f.name}</h4>
                  <div class="text-muted text-sm uppercase tracking-widest font-bold">${f.role} • ${f.dept}</div>
                </div>
              `).join('')}
              ${!collegeData.faculty ? `<div class="text-muted font-bold uppercase col-span-2">Faculty details not available</div>` : ''}
            </div>
          </section>

          <!-- News -->
          <section id="section-news" class="border-b-hard">
            <div class="p-8 border-b-hard bg-surface">
              <h2 class="text-3xl font-black uppercase tracking-tight">News & Articles</h2>
            </div>
            <div class="p-8 flex flex-col gap-6">
              ${(collegeData.news || []).map(n => `
                <div class="border-b-hard pb-4 last:border-b-0 last:pb-0 hover:translate-x-2 transition-transform cursor-pointer">
                  <h4 class="font-bold text-xl">${n.title}</h4>
                  <div class="text-muted text-sm uppercase tracking-widest font-bold mt-2">${n.date}</div>
                </div>
              `).join('')}
              ${!collegeData.news ? `<div class="text-muted font-bold uppercase">No recent news</div>` : ''}
            </div>
          </section>

          <!-- Hostel -->
          <section id="section-hostel" class="border-b-hard">
            <div class="p-8 border-b-hard bg-surface">
              <h2 class="text-3xl font-black uppercase tracking-tight">Hostel</h2>
            </div>
            <div class="p-8">
              ${collegeData.hostel ? `
                <div class="flex flex-wrap gap-12 mb-8">
                  <div>
                    <div class="text-muted uppercase text-sm font-bold tracking-widest mb-1">Fees</div>
                    <div class="font-black text-3xl">₹ ${collegeData.hostel.fees}</div>
                  </div>
                  <div>
                    <div class="text-muted uppercase text-sm font-bold tracking-widest mb-1">Capacity</div>
                    <div class="font-black text-3xl">${collegeData.hostel.capacity}</div>
                  </div>
                </div>
                <h4 class="font-bold uppercase mb-4 tracking-widest text-sm border-b-hard pb-2">Amenities</h4>
                <div class="flex flex-wrap gap-3">
                  ${collegeData.hostel.amenities.map(a => `<div class="border-hard px-4 py-2 text-sm bg-black text-white font-bold uppercase tracking-widest">${a}</div>`).join('')}
                </div>
              ` : `<div class="text-muted font-bold uppercase">Hostel data not available</div>`}
            </div>
          </section>

          <!-- Q&A -->
          <section id="section-qa" class="border-b-hard">
            <div class="p-8 border-b-hard bg-surface">
              <h2 class="text-3xl font-black uppercase tracking-tight">Q&A</h2>
            </div>
            <div class="p-8 flex flex-col gap-8">
              ${(collegeData.qa || []).map(qa => `
                <div class="border-l-4 border-black pl-4">
                  <h4 class="font-black text-xl mb-2">Q: ${qa.q}</h4>
                  <div class="text-muted font-medium text-lg">A: ${qa.a}</div>
                </div>
              `).join('')}
              ${!collegeData.qa ? `<div class="text-muted font-bold uppercase">No Q&A available</div>` : ''}
            </div>
          </section>

        </main>

        <!-- Right Column -->
        <aside class="w-full lg:w-1/3 flex flex-col bg-surface">
          <!-- Placement Chart -->
          <section id="section-placement" class="border-b-hard p-8 flex-1">
            <h2 class="text-2xl font-black uppercase tracking-tight mb-6">Placements</h2>
            <div class="border-hard bg-white p-4 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] mb-6">
              <div class="relative h-64 w-full">
                <canvas id="lineChart"></canvas>
              </div>
            </div>
          </div>
          <!-- Location -->
          <div class="p-8 flex-1 border-b-hard lg:border-b-0">
            <h2 class="text-2xl font-black uppercase tracking-tight mb-6">Location</h2>
            <div class="border-hard bg-white shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] h-64 relative overflow-hidden grayscale hover:grayscale-0 transition-all duration-500">
              ${collegeData.location || '<div class="flex items-center justify-center h-full font-bold uppercase text-muted">Map not available</div>'}
            </div>
          </div>
        </aside>
      </div>

      <!-- Footer -->
      <footer class="bg-black text-white p-8 border-t-hard flex justify-between items-center mt-auto">
        <div class="text-2xl font-black uppercase tracking-tighter">COLLEGEQUEST</div>
        <div class="text-xs font-bold uppercase tracking-widest text-gray-500">© 2024</div>
      </footer>
    `;
    const loginBtn = document.getElementById('nav-login-btn');
    if (loginBtn) {
      if (currentUser) {
        loginBtn.innerText = "Profile";
        loginBtn.onclick = () => window.location.href = "profile.html";
      } else {
        loginBtn.innerText = "Login";
        loginBtn.onclick = () => window.location.href = "index.html";
      }
    }

    initializeChart(collegeData);
    
    const saveBtn = document.getElementById("save-wishlist-btn");
    if (saveBtn) {
      saveBtn.addEventListener("click", async () => {
        if (!currentUser) {
          window.location.href = "index.html";
          return;
        }
        try {
          saveBtn.innerText = "SAVING...";
          const userRef = doc(db, "users", currentUser.uid);
          await updateDoc(userRef, {
            savedColleges: arrayUnion(collegeId)
          });
          saveBtn.innerText = "SAVED TO WISHLIST";
          saveBtn.classList.remove("bg-white", "text-black");
          saveBtn.classList.add("bg-black", "text-white", "border-white");
        } catch (error) {
          console.error("Error saving:", error);
          saveBtn.innerText = "ERROR SAVING";
        }
      });
    }
  }

  searchColleges();
</script>
</body>
</html>
